# Feature flags for Cribug

features:
  # Phase 2 features (always enabled)
  enable_sse: true
  enable_budget: true
  enable_session_memory: true
  enable_session_postgres: false

  # Phase 3 features (disabled by default, enable after implementing)
  enable_dag_workflow: false
  enable_multi_agent: false
  enable_tools: false

  # Phase 4 features
  enable_react: false
  react_max_iterations: 3
  react_audit_ttl_seconds: 86400

  # Real LLM testing (off by default, requires OPENAI_API_KEY)
  real_llm_test: false

  # Phase 4C Slice 12: Two-level token LRU cache
  enable_token_lru_cache: true
  l1_cache_ttl_seconds: 300
  l1_cache_capacity: 10000
  l2_cache_ttl_seconds: 3600
  redis_lru_stats_key: lru:stats
