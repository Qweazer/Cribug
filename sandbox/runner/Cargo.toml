[package]
name = "sandbox-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sandbox-runner"
path = "src/main.rs"

[dependencies]
wasmtime = "18"
wasmtime-wasi = "18"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
os_pipe = "1"
nix = { version = "0.29", features = ["fs"] }
wasi-common = "18"

[profile.release]
opt-level = 2
lto = true
